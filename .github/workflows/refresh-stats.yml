name: Refresh profile stats

# Regenerates assets/stats-{dark,light}.svg from the GitHub API and commits them.
# Self-hosting the card means the profile can never render a broken third-party
# widget — see the note in README.md.
#
# SETUP (one time):
#   The default GITHUB_TOKEN cannot see private contributions, which would drop
#   the totals from ~4,800 to ~30. Create a fine-grained PAT with read access to
#   your profile/contributions, then add it as a repo secret named GH_STATS_TOKEN:
#
#     gh secret set GH_STATS_TOKEN
#
#   Until that secret exists this workflow no-ops instead of failing.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/refresh-stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for stats token
        id: guard
        env:
          TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::GH_STATS_TOKEN is not set — skipping. See the setup notes in this workflow file."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate stat cards
        if: steps.guard.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        if: steps.guard.outputs.ok == 'true'
        run: |
          if git diff --quiet -- assets/; then
            echo "No change in stats — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git commit -m "chore: refresh contribution stats [skip ci]"
          git push
